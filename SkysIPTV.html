<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magyar IPTV Lejátszó + EPG</title>

<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #24242f;
    --border: #2e2e3a;
    --text: #f0f0f5;
    --muted: #9a9aab;
    --accent: #6c5ce7;
    --accent-hover: #7f70f0;
    --danger: #e74c3c;
    --success: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  .search-box {
    flex: 1;
    max-width: 400px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    opacity: 0.7;
  }
  .stats {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: visible;
  }
  .sidebar {
    width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    max-height: 100vh;
    position: sticky;
    top: 0;
    align-self: flex-start;
  }
  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
    border-bottom: 1px solid var(--border);
    max-height: 140px;
    overflow-y: auto;
  }
  .cat-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-btn:hover { border-color: var(--accent); color: var(--text); }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .channel-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .channel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .channel-item:hover { background: var(--surface2); }
  .channel-item.active {
    background: rgba(108, 92, 231, 0.2);
    border: 1px solid var(--accent);
  }
  .channel-item img {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    object-fit: contain;
    background: var(--surface2);
    flex-shrink: 0;
  }
  .channel-item .placeholder {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .channel-item .info { min-width: 0; }
  .channel-item .name {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .channel-item .group {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .channel-item .now-prog {
    font-size: 0.72rem;
    color: var(--accent);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.9;
  }
  .player-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    position: relative;
    min-height: 0;
    overflow-y: auto;
  }
  .video-wrapper {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
    min-height: 280px;
    max-height: 55vh;
  }
  video {
    width: 100%;
    height: 100%;
    max-height: 55vh;
    background: #000;
  }
  .now-playing {
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .now-playing img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: contain;
    background: var(--surface2);
  }
  .now-playing .meta { flex: 1; min-width: 0; }
  .now-playing .title {
    font-weight: 600;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing .subtitle {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .status {
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--surface2);
    color: var(--muted);
  }
  .status.live { background: rgba(46, 204, 113, 0.15); color: var(--success); }
  .status.error { background: rgba(231, 76, 60, 0.15); color: var(--danger); }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
  .overlay-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    color: var(--muted);
    z-index: 5;
    text-align: center;
    padding: 20px;
  }
  .overlay-msg .big { font-size: 3rem; margin-bottom: 12px; }
  .overlay-msg p { max-width: 360px; line-height: 1.5; }
  
  .epg-item {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  .epg-item:last-child { border-bottom: none; }
  .epg-time {
    color: var(--muted);
    min-width: 90px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .epg-item.current .epg-time { color: var(--success); font-weight: 600; }
  .epg-item.current { background: rgba(46,204,113,0.08); border-radius: 4px; }
  .epg-title { color: var(--text); }
  .epg-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    margin-left: 8px;
  }
  .epg-toggle:hover { border-color: var(--accent); color: var(--text); }

  /* Scrollbar */
  .channel-list::-webkit-scrollbar,
  .categories::-webkit-scrollbar { width: 6px; }
  .channel-list::-webkit-scrollbar-track,
  .categories::-webkit-scrollbar-track { background: transparent; }
  .channel-list::-webkit-scrollbar-thumb,
  .categories::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  @media (max-width: 768px) {
    .main { flex-direction: column; overflow: visible; }
    .sidebar { width: 100%; height: 38vh; min-height: 220px; border-right: none; border-bottom: 1px solid var(--border); }
    .player-area { height: auto; min-height: 50vh; overflow-y: auto; }
    .video-wrapper { max-height: 40vh; min-height: 200px; }
    video { max-height: 40vh; }
    header h1 { font-size: 1rem; }
    .stats { display: none; }
  }
</style>
</head>
<body>
<header>
  <img src="SkysIPTV.png" height="60" width="80"> 
  <div class="search-box">
    <input type="text" id="search" placeholder="Keresés csatorna vagy film között..." autocomplete="off">
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="main">
  <aside class="sidebar">
    <div class="categories" id="categories"></div>
    <div class="channel-list" id="channelList"></div>
  </aside>
  <section class="player-area">
    <div class="video-wrapper">
      <video id="video" controls playsinline></video>
      <div class="overlay-msg" id="overlay">
        <div class="big">▶️</div>
        <p>Válassz egy csatornát vagy filmet a bal oldali listából a lejátszáshoz.</p>
      </div>
    </div>
    <div class="now-playing" id="nowPlaying" style="display:none">
      <img id="npLogo" src="" alt="">
      <div class="meta">
        <div class="title" id="npTitle">—</div>
        <div class="subtitle" id="npGroup">—</div>
        <div class="epg-now" id="npEpg" style="display:none; margin-top:4px; font-size:0.82rem; color:var(--accent);"></div>
        <div class="epg-desc" id="npEpgDesc" style="display:none; margin-top:2px; font-size:0.75rem; color:var(--muted); max-height:2.4em; overflow:hidden;"></div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="status" id="npStatus">Betöltés...</div>
        <button class="epg-toggle" id="epgToggle" onclick="toggleEpg()" title="Műsorújság">EPG</button>
      </div>
    </div>
    <div class="epg-panel" id="epgPanel" style="display:none; max-height:320px; overflow-y:auto; background:var(--surface); border-top:1px solid var(--border); padding:8px 16px; flex-shrink:0;">
      <div style="font-size:0.8rem; color:var(--muted); margin-bottom:6px; font-weight:600;">Műsorújság (EPG)</div>
      <div id="epgList"></div>
    </div>
  </section>
</div>

"d":"A múlt és a jelen elevenedik meg a különleges klip-összeállításban, ahol kizárólag a magyar felvételeké a főszerep. Változnak az idők - Dred Bíró Zsolttal a Zenebutikon!"},{"s":"20261031173000","e":"20261031180000","t":"Flört Mónikával","d":"Episode 7 Pop, táncdal és mulatós - Kádár Mónika műsorvezetésével."},{"s":"20261031180000","e":"20261031183000","t":"Járd a táncot Tóthékkal","d":"A Tóthék formáció 2023-ban alakult meg a két népszerű előadó, Katica és Csibész Tóth Miki részvételével. Ők ketten a hazai mulatós zene ismert arcai, külön-külön is kiemelkedő sike"},{"s":"20261031183000","e":"20261031190000","t":"Zenerulett","d":"A műsor egy-egy epizódjában bemutatkozó előadók, adásonként 6-7 dallal szórakoztatják a nézőket. Az énekesek a kaszinók csillogó világában kalandozva mutatják be zenei produkcióika"},{"s":"20261031190000","e":"20261031195500","t":"Zeneexpressz - Fásy Ádám műsora","d":"Fásy Ádám és a Zeneexpressz megállíthatatlan! A zenés vonat tovább robog a Zenebutik TV-n! A Zeneexpressz fogalma immár több, mint másfél évtizede egyet jelent az igényes szórakozt"},{"s":"20261031195500","e":"20261031205000","t":"Ínyenc Party","d":"Ínyenc dallamok, igazi bulihangulat, sok-sok slágerrel és már jól ismert előadókkal. Ínyenc party egy ínyenc helyszínről."},{"s":"20261031205000","e":"20261031212000","t":"Necsi-Necsi 13.","d":"A Necsi-Necsi egy mulatós klipműsor, amelynek műsorvezetői Mátyás Zoltán és Egervölgyi Krisztián, a Matyi és a hegedűs formáció két tagja. A műsorban hazánk ismert mulatós dalaiból"},{"s":"20261031212000","e":"20261031215000","t":"Lokoléo Party - Jollyval","d":"A Lokoléo Party - Jollyval, Jolly első, önálló műsora, melyben főként mulatós dalok, latin ritmusok és fülbemászó slágerek is hallhatóak."},{"s":"20261031215000","e":"20261031222000","t":"Lokoléo Party - Jollyval","d":"A Lokoléo Party - Jollyval, Jolly első, önálló műsora, melyben főként mulatós dalok, latin ritmusok és fülbemászó slágerek is hallhatóak."}]};

let currentGroup = 'Összes';
let currentIndex = -1;
let hls = null;
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const nowPlaying = document.getElementById('nowPlaying');

// Build unique groups sorted by count
const groupCounts = {};
CHANNELS.forEach(c => { groupCounts[c.g] = (groupCounts[c.g] || 0) + 1; });
const groups = Object.keys(groupCounts).sort((a,b) => groupCounts[b] - groupCounts[a]);

function renderCategories() {
  const el = document.getElementById('categories');
  let html = `<button class="cat-btn ${currentGroup==='Összes'?'active':''}" data-g="Összes">Összes (${CHANNELS.length})</button>`;
  groups.forEach(g => {
    html += `<button class="cat-btn ${currentGroup===g?'active':''}" data-g="${g}">${g} (${groupCounts[g]})</button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentGroup = btn.dataset.g;
      renderCategories();
      renderChannels();
    });
  });
}

function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return CHANNELS.filter(c => {
    const matchGroup = currentGroup === 'Összes' || c.g === currentGroup;
    const matchSearch = !q || c.n.toLowerCase().includes(q) || c.g.toLowerCase().includes(q);
    return matchGroup && matchSearch;
  });
}

function renderChannels() {
  const list = getFiltered();
  const el = document.getElementById('channelList');
  document.getElementById('stats').textContent = `${list.length} találat`;
  
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>Nincs találat</div>`;
    return;
  }
  
  el.innerHTML = list.map((c, i) => {
    const realIdx = CHANNELS.indexOf(c);
    const logo = c.l ? `<img src="${c.l}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none">📺</div>` 
                     : `<div class="placeholder">📺</div>`;
    // Aktuális műsor címe az EPG-ből
    let nowProgHtml = '';
    const epgData = typeof EPG !== 'undefined' ? EPG[c.n] : null;
    if (epgData) {
      const { current } = getCurrentAndNext(epgData);
      if (current && current.t) {
        nowProgHtml = `<div class="now-prog" title="${escapeHtml(current.t)}">▶ ${escapeHtml(current.t)}</div>`;
      }
    }
    return `<div class="channel-item ${realIdx===currentIndex?'active':''}" data-idx="${realIdx}">
      ${logo}
      <div class="info">
        <div class="name">${escapeHtml(c.n)}</div>
        ${nowProgHtml}
        <div class="group">${escapeHtml(c.g)}</div>
      </div>
    </div>`;
  }).join('');
  
  el.querySelectorAll('.channel-item').forEach(item => {
    item.addEventListener('click', () => playChannel(+item.dataset.idx));
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(text, type='') {
  const el = document.getElementById('npStatus');
  el.textContent = text;
  el.className = 'status ' + type;
}


function parseEpgTime(s) {
  // YYYYMMDDHHMMSS -> Date (UTC)
  const y = +s.slice(0,4), m = +s.slice(4,6)-1, d = +s.slice(6,8);
  const h = +s.slice(8,10), mi = +s.slice(10,12), se = +s.slice(12,14);
  return new Date(Date.UTC(y,m,d,h,mi,se));
}

function formatTime(d) {
  return d.toLocaleTimeString('hu-HU', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Budapest'});
}

function getCurrentAndNext(epgList) {
  if (!epgList || !epgList.length) return {current:null, next:null, all:[]};
  const now = new Date(); // system time; data is for 2026-10-31
  // For demo / matching data, if year differs, use a fixed now close to data
  let ref = now;
  if (now.getFullYear() < 2026) {
    ref = new Date(Date.UTC(2026, 9, 31, 13, 12)); // 2026-10-31 15:12 CET approx
  }
  let current = null, next = null;
  for (let i = 0; i < epgList.length; i++) {
    const p = epgList[i];
    const s = parseEpgTime(p.s);
    const e = parseEpgTime(p.e);
    if (s <= ref && ref < e) {
      current = p;
      if (i+1 < epgList.length) next = epgList[i+1];
      break;
    }
    if (s > ref) {
      next = p;
      break;
    }
  }
  return {current, next, all: epgList};
}

function updateEpgUI(chName) {
  const epgEl = document.getElementById('npEpg');
  const descEl = document.getElementById('npEpgDesc');
  const panel = document.getElementById('epgPanel');
  const listEl = document.getElementById('epgList');
  const data = EPG[chName];
  if (!data) {
    epgEl.style.display = 'none';
    descEl.style.display = 'none';
    panel.style.display = 'none';
    return;
  }
  const {current, next, all} = getCurrentAndNext(data);
  if (current) {
    const s = parseEpgTime(current.s);
    const e = parseEpgTime(current.e);
    epgEl.textContent = `Most: ${current.t} (${formatTime(s)}–${formatTime(e)})`;
    epgEl.style.display = '';
    if (current.d) {
      descEl.textContent = current.d;
      descEl.style.display = '';
    } else {
      descEl.style.display = 'none';
    }
  } else if (next) {
    const s = parseEpgTime(next.s);
    epgEl.textContent = `Következő: ${next.t} (${formatTime(s)})`;
    epgEl.style.display = '';
    descEl.style.display = 'none';
  } else {
    epgEl.style.display = 'none';
    descEl.style.display = 'none';
  }
  // Fill panel
  listEl.innerHTML = all.map(p => {
    const s = parseEpgTime(p.s);
    const e = parseEpgTime(p.e);
    const isCur = current && p.s === current.s;
    return `<div class="epg-item ${isCur?'current':''}">
      <span class="epg-time">${formatTime(s)} – ${formatTime(e)}</span>
      <span class="epg-title">${escapeHtml(p.t)}</span>
    </div>`;
  }).join('');
}

function toggleEpg() {
  const panel = document.getElementById('epgPanel');
  const willShow = panel.style.display === 'none';
  panel.style.display = willShow ? 'block' : 'none';
  if (willShow) {
    setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }
}


function playChannel(idx) {
  if (idx < 0 || idx >= CHANNELS.length) return;
  currentIndex = idx;
  const ch = CHANNELS[idx];
  
  overlay.style.display = 'none';
  nowPlaying.style.display = 'flex';
  document.getElementById('npTitle').textContent = ch.n;
  document.getElementById('npGroup').textContent = ch.g;
  const logoEl = document.getElementById('npLogo');
  if (ch.l) {
    logoEl.src = ch.l;
    logoEl.style.display = '';
  } else {
    logoEl.style.display = 'none';
  }
  setStatus('Betöltés...', '');
  updateEpgUI(ch.n);
  // Auto show EPG panel for live channels with data
  const panel = document.getElementById('epgPanel');
  if (EPG[ch.n]) {
    panel.style.display = 'block';
    // Görgessünk az EPG-hez, hogy látszódjon
    setTimeout(() => {
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  } else {
    panel.style.display = 'none';
  }
  
  // destroy previous
  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.removeAttribute('src');
  video.load();
  
  const url = ch.u;
  const isHls = url.includes('.m3u8') || url.includes('playlist');
  
  if (isHls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 30,
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus('Élő', 'live');
      video.play().catch(() => setStatus('Kattints a play-re', ''));
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        setStatus('Hiba a streammel', 'error');
        console.error('HLS error', data);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl') && isHls) {
    // Safari native HLS
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      setStatus('Élő', 'live');
      video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => setStatus('Hiba a streammel', 'error'), { once: true });
  } else {
    // progressive / mp4 / webm
    video.src = url;
    video.addEventListener('loadeddata', () => {
      setStatus('Lejátszás', 'live');
      video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => setStatus('Hiba a streammel', 'error'), { once: true });
  }
  
  renderChannels(); // update active state
  // scroll active into view
  const active = document.querySelector('.channel-item.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.getElementById('search').addEventListener('input', () => {
  renderChannels();
});

// Keyboard: arrow up/down to change channel
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const list = getFiltered();
  if (!list.length) return;
  const curPos = list.findIndex(c => CHANNELS.indexOf(c) === currentIndex);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = list[Math.min(curPos + 1, list.length - 1)] || list[0];
    playChannel(CHANNELS.indexOf(next));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = list[Math.max(curPos - 1, 0)] || list[list.length-1];
    playChannel(CHANNELS.indexOf(prev));
  }
});

renderCategories();
renderChannels();
</script>
</body>
</html>
